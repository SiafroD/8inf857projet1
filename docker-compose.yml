services:
  elasticsearch:
    build: ./docker/elasticsearch
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - eslogs:/usr/share/elasticsearch/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - siem

  kibana:
    build: ./docker/kibana
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    volumes:
      - kibana-logs:/usr/share/kibana/logs
    networks:
      - siem

  syslog-ng:
    build: ./docker/syslog-ng
    container_name: syslog-ng
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "514:514/udp"
      - "601:601/tcp"
    networks:
      - siem

  elasticsearch-log-agent:
    image: balabit/syslog-ng:3.38.1
    container_name: elasticsearch-log-agent
    depends_on:
      elasticsearch:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - eslogs:/logs:ro
      - ./docker/elasticsearch/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps", "-f", "/etc/syslog-ng/syslog-ng.conf"]
    networks:
      - siem

  kibana-log-agent:
    image: balabit/syslog-ng:3.38.1
    container_name: kibana-log-agent
    depends_on:
      kibana:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - kibana-logs:/logs:ro
      - ./docker/kibana/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps", "-f", "/etc/syslog-ng/syslog-ng.conf"]
    networks:
      - siem

volumes:
  esdata:
    driver: local
  eslogs:
    driver: local
  kibana-logs:
    driver: local

networks:
  siem:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-docker-0