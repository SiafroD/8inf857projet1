# Public zone: Traefik on :80 is the only way in.
services:
  traefik-public:
    image: docker.io/library/traefik:v3.7.14
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      # Headers are dropped from the access log by default; the user agent is what
      # gives sqlmap or Nikto away.
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Referer=keep
    ports:
      - "80:80"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-public-logs:/var/log/traefik
    networks:
      - public

  nginx:
    image: docker.io/library/nginx:1.30.5-alpine
    # nginx resolves syslog-ng and backend once, at start: they must be up by then.
    depends_on:
      syslog-ng:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - public
      - logs
      - app

  # Same pattern as the SIEM's agents: reads the access log from the shared
  # volume and forwards it to the central syslog-ng (TCP 601).
  traefik-public-log-agent:
    image: balabit/syslog-ng:3.38.1
    depends_on:
      traefik-public:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - traefik-public-logs:/logs:ro
      - ./traefik/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps"]
    # On logs, like every source of the public zone: it can send logs, nothing else.
    networks:
      - logs

  # The shop's backend: DB-backed login and product search, logs every request
  # to syslog-ng directly (UDP 514, program "backend").
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      syslog-ng:
        condition: service_healthy
    networks:
      - app
      - db
      - logs

  # The products and users database. Only the backend can reach it (db network);
  # nothing in the public zone can.
  db:
    image: docker.io/library/postgres:17.11-alpine
    environment:
      - POSTGRES_DB=shop
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - db

  # A plain Linux host on the public zone: sshd only, so the lab has an SSH login
  # to attack. Reached from a container on the public network; also published on
  # the box loopback (2222) for a demo through the tunnel, never on the Wi-Fi.
  ssh:
    build: ./ssh
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ssh-logs:/var/log/sshd
    networks:
      - public

  ssh-log-agent:
    image: balabit/syslog-ng:3.38.1
    depends_on:
      ssh:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - ssh-logs:/logs:ro
      - ./ssh/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps"]
    networks:
      - logs

  # Network sensor for the public zone. It sniffs the public bridge, so it sees
  # the scans and the raw traffic no single service logs. Needs the bridge in its
  # own netns: that holds under Docker (rootful, bridge in the host netns), where
  # com.docker.network.bridge.name gives it the fixed name "soc-public". Under our
  # rootless Podman the bridge lives in Podman's own netns, out of host reach, so
  # this one service exits there (AF_PACKET: Operation not permitted). The rules and
  # the eve.json -> agent -> syslog-ng chain were checked live from nginx's netns.
  suricata:
    # jasonish/suricata 8.0.7 plus the frozen ET Open ruleset (suricata/et-open/VERSION).
    build: ./suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      # Outside /etc/suricata: the image's entrypoint chowns that folder and stops
      # on a read-only file in it.
      - ./suricata/local.rules:/rules/local.rules:ro
      - suricata-logs:/var/log/suricata
    # ET Open from the image (/opt/et-open/rules), plus our own rules on top (-s adds,
    # where -S would load only that file).
    command: ["-i", "soc-public", "--set", "default-rule-path=/opt/et-open/rules",
              "-s", "/rules/local.rules", "-l", "/var/log/suricata"]

  suricata-log-agent:
    image: balabit/syslog-ng:3.38.1
    depends_on:
      syslog-ng:
        condition: service_started
    volumes:
      - suricata-logs:/logs:ro
      - ./suricata/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps"]
    networks:
      - logs

volumes:
  traefik-public-logs:
  ssh-logs:
  pgdata:
  suricata-logs:
