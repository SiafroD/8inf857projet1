server {
    listen 80;

    # The client's real address, not Traefik's: trusted only from the public network.
    set_real_ip_from 10.201.1.0/24;
    real_ip_header X-Forwarded-For;

    access_log syslog:server=syslog-ng:514,tag=nginx combined;
    error_log syslog:server=syslog-ng:514,tag=nginx warn;

    root /usr/share/nginx/html;

    # Login and product search are handled by the backend (DB-backed), which logs
    # every attempt. nginx passes the real client address along.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
