server {
    listen 80;

    # The client's real address, not Traefik's: trusted only from the public network.
    set_real_ip_from 10.201.1.0/24;
    real_ip_header X-Forwarded-For;

    # Failed logins land in the error log ("password mismatch", "was not found"),
    # with the user name and the client's address.
    access_log syslog:server=syslog-ng:514,tag=nginx combined;
    error_log syslog:server=syslog-ng:514,tag=nginx warn;

    root /usr/share/nginx/html;

    # Nothing behind it: the query string in the access log is the point.
    location = /recherche {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Recherche</title><p>Aucun résultat. <a href="/">Retour</a></p>';
    }

    # Checked by the login page (login.html). 403 and not 401, so that a browser
    # never pops up its own password dialog.
    location = /api/login {
        auth_basic "Intranet";
        auth_basic_user_file /etc/nginx/htpasswd;
        error_page 401 =403 /login-failed.json;
        default_type application/json;
        alias /usr/share/nginx/html/login-ok.json;
    }

    location /admin/ {
        auth_basic "Intranet";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}
