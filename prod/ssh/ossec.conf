<ossec_config>
  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <!-- The manager has authd with no password, so the agent registers itself on
         first start; agent_name fixes agent.name instead of the random container id. -->
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh-manager</manager_address>
      <port>1515</port>
      <agent_name>ssh</agent_name>
    </enrollment>
  </client>

  <!-- The persistence scenario drops an attacker key in authorized_keys and a beacon
       line in .bashrc. realtime catches it at once; report_changes adds the diff; the
       short frequency is the fallback scan that also picks up a newly created .ssh. -->
  <syscheck>
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <frequency>60</frequency>
    <directories realtime="yes" report_changes="yes" check_all="yes">/home/sysadmin/.ssh</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/home/sysadmin/.bashrc</directories>
  </syscheck>
</ossec_config>
