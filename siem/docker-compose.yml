# SIEM zone: syslog-ng, Elasticsearch, Kibana and their log agents. Nothing here is
# reachable from the public zone; Kibana is served by the admin Traefik.
services:
  elasticsearch:
    build: ./elasticsearch
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - eslogs:/usr/share/elasticsearch/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -q ''"status"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  kibana:
    build: ./kibana
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana-logs:/usr/share/kibana/logs
    networks:
      - admin
      - data

  syslog-ng:
    build: ./syslog-ng
    container_name: syslog-ng
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:514:514/udp"
      - "127.0.0.1:601:601/tcp"
    command: ["--no-caps"]
    networks:
      - logs
      - data

  elasticsearch-log-agent:
    image: balabit/syslog-ng:3.38.1
    container_name: elasticsearch-log-agent
    depends_on:
      elasticsearch:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - eslogs:/logs:ro
      - ./elasticsearch/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps"]
    networks:
      - data

  kibana-log-agent:
    image: balabit/syslog-ng:3.38.1
    container_name: kibana-log-agent
    depends_on:
      kibana:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - kibana-logs:/logs:ro
      - ./kibana/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps"]
    networks:
      - data

  # Service d'initialisation : attend que Kibana soit prêt, importe l'export
  # (Data View, visualisations, dashboard) puis s'arrête.
  kibana-setup:
    image: curlimages/curl:latest
    container_name: kibana-setup
    depends_on:
      - kibana
    volumes:
      - ./kibana-export:/import:ro
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Attente de Kibana..."
        until curl -s http://kibana:5601/api/status | grep -q '"level":"available"'; do sleep 5; done
        echo "Import des objets Kibana..."
        curl -s -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
          -H "kbn-xsrf: true" \
          --form file=@/import/kibana-dashboard.ndjson
        echo ""
        echo "Import terminé."
    networks:
      - data

volumes:
  esdata:
    driver: local
  eslogs:
    driver: local
  kibana-logs:
    driver: local
