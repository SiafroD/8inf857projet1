# SIEM zone: syslog-ng, Elasticsearch, Kibana and their log agents. Nothing here is
# reachable from the public zone; Kibana is served by the admin Traefik.
services:
  elasticsearch:
    build: ./elasticsearch
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - eslogs:/usr/share/elasticsearch/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -q ''"status"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  kibana:
    build: ./kibana
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana-logs:/usr/share/kibana/logs
    networks:
      - admin
      - data

  syslog-ng:
    build: ./syslog-ng
    container_name: syslog-ng
    depends_on:
      elasticsearch:
        condition: service_healthy
      wazuh-template:
        condition: service_completed_successfully
      wazuh-manager:
        condition: service_started
    ports:
      - "127.0.0.1:514:514/udp"
      - "127.0.0.1:601:601/tcp"
    command: ["--no-caps"]
    networks:
      - logs
      - data

  # Analyses the copy of every log that syslog-ng sends it, and writes its alerts to
  # alerts.json; wazuh-log-agent ships them.
  wazuh-manager:
    image: docker.io/wazuh/wazuh-manager:4.14.8
    container_name: wazuh-manager
    # Otherwise the random container id becomes agent.name and manager.name in alerts.
    hostname: wazuh-manager
    volumes:
      - ./wazuh/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./wazuh/local_decoder.xml:/wazuh-config-mount/etc/decoders/local_decoder.xml:ro
      - ./wazuh/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      # s6 never starts a service whose folder holds a "down" file. The bundled
      # Filebeat would ship the alerts to a Wazuh indexer; syslog-ng does it here.
      - ./wazuh/filebeat-down:/etc/services.d/filebeat/down:ro
      - wazuh-logs:/var/ossec/logs
    depends_on:
      mailpit:
        condition: service_started
    networks:
      - data

  # Catches the e-mail alerts Wazuh sends on a confirmed intrusion (level >= 10,
  # siem/wazuh/ossec.conf). A real SMTP server would do; Mailpit needs no account
  # and shows the mails in a web UI, so the notification is reproducible in the lab.
  # UI on the loopback only; SMTP on 25 inside the data network (Wazuh dials port 25).
  mailpit:
    image: docker.io/axllent/mailpit:v1.31.4
    container_name: mailpit
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:25
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - data

  # Logstash installs the Wazuh template itself; syslog-ng cannot, and the
  # template must be in before the first alert creates its index.
  wazuh-template:
    image: docker.io/curlimages/curl:latest
    container_name: wazuh-template
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./wazuh/wz-es-4.x-8.x-template.json:/template.json:ro
    command:
      - -fsS
      - -X
      - PUT
      - http://elasticsearch:9200/_index_template/wazuh
      - -H
      - "Content-Type: application/json"
      - --data-binary
      - "@/template.json"
    networks:
      - data

  elasticsearch-log-agent:
    image: balabit/syslog-ng:3.38.1
    container_name: elasticsearch-log-agent
    depends_on:
      elasticsearch:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - eslogs:/logs:ro
      - ./elasticsearch/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps"]
    networks:
      - data

  kibana-log-agent:
    image: balabit/syslog-ng:3.38.1
    container_name: kibana-log-agent
    depends_on:
      kibana:
        condition: service_started
      syslog-ng:
        condition: service_started
    volumes:
      - kibana-logs:/logs:ro
      - ./kibana/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps"]
    networks:
      - data

  # Wazuh only writes its alerts to a file (alerts.json); its one network output
  # (syslog_output) is UDP, which loses alerts. The Wazuh docs have a forwarder read
  # that file next to the manager: this sidecar, like the other agents, so that the
  # central syslog-ng only takes logs from the network and mounts no one's disk.
  wazuh-log-agent:
    image: docker.io/balabit/syslog-ng:3.38.1
    container_name: wazuh-log-agent
    depends_on:
      wazuh-manager:
        condition: service_started
      # Healthy, not started: a first connection refused waits 60 s (time-reopen).
      syslog-ng:
        condition: service_healthy
    # The persist file holds how far alerts.json was read; without the volume, every
    # new container would send all the alerts again.
    volumes:
      - wazuh-logs:/var/ossec/logs:ro
      - wazuh-log-agent-state:/var/lib/syslog-ng/state
      - ./wazuh/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    entrypoint: ["syslog-ng"]
    command: ["-F", "--no-caps", "--persist-file=/var/lib/syslog-ng/state/syslog-ng.persist"]
    networks:
      - data

  # Service d'initialisation : attend que Kibana soit prêt, importe l'export
  # (Data View, visualisations, dashboard) puis s'arrête.
  kibana-setup:
    image: curlimages/curl:latest
    container_name: kibana-setup
    depends_on:
      - kibana
    volumes:
      - ./kibana-export:/import:ro
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Attente de Kibana..."
        until curl -s http://kibana:5601/api/status | grep -q '"level":"available"'; do sleep 5; done
        for f in /import/*.ndjson; do
          echo "Import de $$f..."
          curl -s -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
            -H "kbn-xsrf: true" \
            --form file=@$$f
          echo ""
        done
        echo "Import terminé."
    networks:
      - data

volumes:
  esdata:
    driver: local
  eslogs:
    driver: local
  kibana-logs:
    driver: local
  wazuh-logs:
  wazuh-log-agent-state:
