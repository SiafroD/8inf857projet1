@version: 4.12
@include "scl.conf"
@module http

options {
    keep-hostname(yes);
    stats(freq(0));
    use-dns(no);
};

source s_agent_tcp {
    network(
        port(601)
        transport("tcp")
    );
};

source s_external_udp {
    network(
        port(514)
        transport("udp")
    );
};

# Wazuh's alerts, sent by wazuh-log-agent (siem/wazuh/syslog-ng.conf).
source s_wazuh_alerts {
    network(
        port(602)
        transport("tcp")
        flags(no-parse)
        log-msg-size(10485760)
    );
};

# syslog-ng also listens on the logs network, where the public zone lives: only
# the data network may write alerts.
filter f_data_network {
    netmask("10.201.4.0/24"); #wazuh subnet
};

destination d_elasticsearch {
    http(
        url("http://elasticsearch:9200/_bulk")
        method("POST")
        headers("Content-Type: application/x-ndjson")
        body("$(format-json --scope none --omit-empty-values index._index=syslog-${S_YEAR}.${S_MONTH})\n$(format-json --scope none --omit-empty-values --pair @timestamp=$ISODATE --pair host.name=$HOST --pair host.ip=$SOURCEIP --pair message=$MESSAGE --pair process.name=$PROGRAM --pair event.kind=event --pair event.type=log --pair event.dataset=syslog.forwarded --pair ecs.version=8.0.0)")
        body-suffix("\n")
        batch-lines(32)
        timeout(10)
        persist-name("es_external")
    );
};

destination d_elasticsearch_container_logs {
    http(
        url("http://elasticsearch:9200/_bulk")
        method("POST")
        headers("Content-Type: application/x-ndjson")
        body("$(format-json --scope none --omit-empty-values index._index=syslog-${S_YEAR}.${S_MONTH})\n$(format-json --scope none --omit-empty-values --pair @timestamp=$ISODATE --pair host.name=$HOST --pair host.ip=$SOURCEIP --pair container.name=$PROGRAM --pair message=$MESSAGE --pair process.name=$PROGRAM --pair event.kind=event --pair event.type=log --pair event.dataset=syslog.forwarded --pair ecs.version=8.0.0)")
        body-suffix("\n")
        batch-lines(32)
        timeout(10)
        persist-name("es_container_logs")
    );
};

# Plain BSD syslog: Wazuh's predecoder takes the program name (nginx, kibana...)
# from its header.
destination d_wazuh {
    network(
        "wazuh-manager"
        port(514)
        transport("tcp")
    );
};

destination d_wazuh_alerts {
    elasticsearch-http(
        url("http://elasticsearch:9200/_bulk")
        index("wazuh-alerts-4.x-${R_YEAR}.${R_MONTH}.${R_DAY}")
        # A _bulk that times out is sent again although Elasticsearch may have indexed
        # it: with the alert's own id, the retry overwrites instead of duplicating.
        custom_id("${.alert.id}")
        template("$MESSAGE")
    );
};

# Suricata writes its counters to eve.json every 8 s: about 500 fields each, more
# than Wazuh's JSON decoder takes (256), so every one logs an error in Wazuh, and
# no Wazuh rule uses them. They still go to Elasticsearch.
filter f_not_suricata_stats {
    not (program("suricata" type(string))
         and message('"event_type":"stats"' type(string) flags(substring)));
};

log {
    source(s_agent_tcp);
    destination(d_elasticsearch_container_logs);
};

log {
    source(s_agent_tcp);
    filter(f_not_suricata_stats);
    destination(d_wazuh);
};

log {
    source(s_external_udp);
    destination(d_elasticsearch);
    destination(d_wazuh);
};

# Alerts go to Elasticsearch only, never back to Wazuh. flow-control: when
# Elasticsearch falls behind, stop reading the connection; TCP then holds back
# wazuh-log-agent, which stops reading alerts.json, and nothing is dropped.
log {
    source(s_wazuh_alerts);
    filter(f_data_network);
    parser { json-parser(prefix(".alert.")); };
    destination(d_wazuh_alerts);
    flags(flow-control);
};
