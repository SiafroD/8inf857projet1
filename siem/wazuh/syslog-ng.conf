@version: 3.38

options {
    stats_freq(0);
};

source s_wazuh_alerts {
    file(
        "/var/ossec/logs/alerts/alerts.json"
        follow-freq(1)
        flags(no-parse)
        # An alert holds the log that raised it, and for a frequency rule the previous
        # ones too: it can outgrow the default 64 KiB, and a cut line is no longer JSON.
        log-msg-size(10485760)
    );
};

# Port 602, not 601: everything on 601 is also copied to Wazuh, and Wazuh must never
# analyse its own alerts. The bare JSON line, without a syslog header, is what
# Elasticsearch indexes.
destination d_central_syslog {
    network(
        "syslog-ng"
        port(602)
        transport("tcp")
        template("$MSG\n")
    );
};

# flow-control: when the central syslog-ng falls behind, stop reading the file
# instead of dropping alerts; they wait in alerts.json.
log {
    source(s_wazuh_alerts);
    destination(d_central_syslog);
    flags(flow-control);
};
